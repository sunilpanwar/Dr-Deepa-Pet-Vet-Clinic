<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pet Care Articles from Dr. Deepa Pet Vet Clinic - Expert advice on dog and cat health, nutrition, and wellness.">
    <meta name="keywords" content="pet care articles, dog health, cat health, veterinary advice, pet nutrition, pet wellness">
    <title>Pet Care Articles - Dr. Deepa Pet Vet Clinic</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="js/components-loader.js"></script>
    <style>
        /* Articles Page Specific Styles */
        .articles-page-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 1.5rem 0;
            text-align: center;
            margin-top: 70px;
        }
        
        .articles-page-header h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .articles-page-header p {
            font-size: 1.125rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .articles-filters {
            background: var(--light-color);
            padding: 1.5rem 0;
            position: sticky;
            top: 70px;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        
        .filter-toggle {
            display: none;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .filter-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .filter-btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--primary-color);
            background: var(--white);
            color: var(--primary-color);
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-normal);
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary-color);
            color: var(--white);
        }
        
        .search-box {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--light-gray);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            width: 300px;
            max-width: 100%;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .articles-main {
            padding: 2rem 0;
            background: var(--white);
        }
        
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }
        
        .article-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: var(--transition-normal);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        
        .article-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-xl);
        }
        
        .article-image {
            position: relative;
            height: 200px;
            overflow: hidden;
        }
        
        .article-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-slow);
        }
        
        .article-card:hover .article-image img {
            transform: scale(1.1);
        }
        
        .article-category {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--secondary-color);
            color: var(--white);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-lg);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .article-content {
            padding: var(--spacing-md);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .article-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--gray);
            font-size: 0.875rem;
            margin-bottom: var(--spacing-sm);
            flex-wrap: wrap;
        }
        
        .article-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
        
        .article-meta i {
            color: var(--primary-color);
        }
        
        .article-content h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            color: var(--dark-color);
            margin-bottom: var(--spacing-sm);
            line-height: 1.3;
        }
        
        .article-excerpt {
            color: var(--gray);
            line-height: 1.8;
            margin-bottom: var(--spacing-md);
            flex: 1;
        }
        
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: var(--spacing-sm);
        }
        
        .tag {
            background: var(--light-color);
            color: var(--primary-color);
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .read-more-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            font-weight: 600;
            transition: var(--transition-normal);
        }
        
        .read-more-btn:hover {
            gap: 0.75rem;
        }
        
        .results-info {
            text-align: center;
            color: var(--gray);
            margin-bottom: var(--spacing-md);
            font-size: 1.125rem;
        }
        
        .results-info strong {
            color: var(--primary-color);
        }
        
        /* Article Modal */
        .article-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-y: auto;
        }
        
        .article-modal.active {
            display: flex;
        }
        
        .article-modal-content {
            background: var(--white);
            border-radius: var(--radius-xl);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.3s ease;
        }
        
        .article-modal-header {
            position: relative;
            height: 300px;
            overflow: hidden;
        }
        
        .article-modal-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .article-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--white);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-normal);
        }
        
        .article-modal-close:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: rotate(90deg);
        }
        
        .article-modal-body {
            padding: 2rem;
        }
        
        .article-share-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            margin-bottom: 1.5rem;
            border-top: 2px solid var(--light-color);
            border-bottom: 2px solid var(--light-color);
        }
        
        .share-label {
            font-weight: 600;
            color: var(--dark-color);
            font-size: 1rem;
        }
        
        .share-buttons {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .share-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--white);
            font-size: 1.125rem;
            cursor: pointer;
            transition: var(--transition-normal);
            border: none;
        }
        
        .share-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        
        .share-btn.facebook {
            background: #1877F2;
        }
        
        .share-btn.twitter {
            background: #1DA1F2;
        }
        
        .share-btn.whatsapp {
            background: #25D366;
        }
        
        .share-btn.linkedin {
            background: #0A66C2;
        }
        
        .share-btn.email {
            background: #EA4335;
        }
        
        .share-btn.copy {
            background: var(--gray);
        }
        
        .share-btn.copy.copied {
            background: var(--success);
        }
        
        .article-modal-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            color: var(--dark-color);
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        
        .article-modal-meta {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            color: var(--gray);
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--light-color);
            flex-wrap: wrap;
        }
        
        .article-modal-meta span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .article-modal-meta i {
            color: var(--primary-color);
        }
        
        .article-modal-text {
            color: var(--dark-color);
            line-height: 1.8;
            font-size: 1.05rem;
        }
        
        .article-modal-text h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        
        .article-modal-text h3 {
            font-size: 1.25rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--dark-color);
        }
        
        .article-modal-text p {
            margin-bottom: 1rem;
        }
        
        .article-modal-text strong {
            color: var(--primary-color);
        }
        
        .article-modal-text ul,
        .article-modal-text ol {
            margin-left: 2rem;
            margin-bottom: 1rem;
        }
        
        .article-modal-text li {
            margin-bottom: 0.5rem;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .articles-page-header {
                margin-top: 60px;
                padding: 1rem 0;
            }
            
            .articles-page-header h1 {
                font-size: 2rem;
            }
            
            .share-label {
                display: none;
            }
            
            .article-share-section {
                justify-content: center;
            }
            
            .articles-filters {
                position: sticky;
                top: 60px;
                padding: 0.75rem 0;
            }
            
            .filter-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }
            
            .filter-container {
                flex-direction: column;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }
            
            .filter-container.active {
                max-height: 600px;
            }
            
            .search-box {
                width: 100%;
            }
            
            .articles-grid {
                grid-template-columns: 1fr;
            }
            
            .article-modal-header {
                height: 200px;
            }
            
            .article-modal-body {
                padding: 1.5rem;
            }
            
            .article-modal-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header loads automatically from includes/header.html -->

    <!-- Page Header -->
    <section class="articles-page-header">
        <div class="container">
            <h1><i class="fas fa-book-open"></i> Pet Care Articles</h1>
            <p>Expert advice and educational resources for your pet's health and wellness</p>
        </div>
    </section>

    <!-- Filters -->
    <section class="articles-filters">
        <div class="container">
            <button class="filter-toggle" id="filterToggle">
                <i class="fas fa-filter"></i> <span>Show Filters</span>
            </button>
            <div class="filter-container" id="filterContainer">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-th"></i> All Articles
                </button>
                <button class="filter-btn" data-filter="health">
                    <i class="fas fa-heartbeat"></i> Health
                </button>
                <button class="filter-btn" data-filter="nutrition">
                    <i class="fas fa-utensils"></i> Nutrition
                </button>
                <button class="filter-btn" data-filter="preventive">
                    <i class="fas fa-shield-alt"></i> Preventive Care
                </button>
                <button class="filter-btn" data-filter="dental">
                    <i class="fas fa-tooth"></i> Dental
                </button>
                <button class="filter-btn" data-filter="seasonal">
                    <i class="fas fa-sun"></i> Seasonal
                </button>
                <input type="text" class="search-box" id="searchBox" placeholder="Search articles...">
            </div>
        </div>
    </section>

    <!-- Articles Grid -->
    <section class="articles-main">
        <div class="container">
            <div class="results-info" id="resultsInfo">
                Showing <strong id="showingCount">6</strong> of <strong id="totalCount">6</strong> articles
            </div>
            
            <div class="articles-grid" id="articlesGrid">
                <!-- Articles will be loaded dynamically from data/articles.json -->
            </div>
        </div>
    </section>

    <!-- Article Modal -->
    <div id="articleModal" class="article-modal">
        <div class="article-modal-content">
            <div class="article-modal-header">
                <img id="modalImage" src="" alt="">
                <button class="article-modal-close" id="closeModal">&times;</button>
            </div>
            <div class="article-modal-body">
                <h1 class="article-modal-title" id="modalTitle"></h1>
                <div class="article-modal-meta" id="modalMeta"></div>
                
                <!-- Share Section -->
                <div class="article-share-section">
                    <span class="share-label"><i class="fas fa-share-alt"></i> Share:</span>
                    <div class="share-buttons">
                        <button class="share-btn facebook" id="shareFacebook" title="Share on Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </button>
                        <button class="share-btn twitter" id="shareTwitter" title="Share on Twitter">
                            <i class="fab fa-twitter"></i>
                        </button>
                        <button class="share-btn whatsapp" id="shareWhatsapp" title="Share on WhatsApp">
                            <i class="fab fa-whatsapp"></i>
                        </button>
                        <button class="share-btn linkedin" id="shareLinkedin" title="Share on LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </button>
                        <button class="share-btn email" id="shareEmail" title="Share via Email">
                            <i class="fas fa-envelope"></i>
                        </button>
                        <button class="share-btn copy" id="shareCopy" title="Copy Link">
                            <i class="fas fa-link"></i>
                        </button>
                    </div>
                </div>
                
                <div class="article-modal-text" id="modalContent"></div>
            </div>
        </div>
    </div>

    <!-- Footer and Scroll to Top Button load automatically from includes/footer.html -->

    <script src="js/script.js"></script>
    <script src="js/load-articles.js"></script>
    <script>
        // Mobile filter toggle
        const filterToggle = document.getElementById('filterToggle');
        const filterContainer = document.getElementById('filterContainer');
        
        if (filterToggle) {
            filterToggle.addEventListener('click', function() {
                filterContainer.classList.toggle('active');
                const isActive = filterContainer.classList.contains('active');
                const toggleText = this.querySelector('span');
                const toggleIcon = this.querySelector('i');
                
                if (isActive) {
                    toggleText.textContent = 'Hide Filters';
                    toggleIcon.className = 'fas fa-times';
                } else {
                    toggleText.textContent = 'Show Filters';
                    toggleIcon.className = 'fas fa-filter';
                }
            });
        }
    </script>
</body>
</html>
