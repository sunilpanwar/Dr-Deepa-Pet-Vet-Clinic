<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Success Stories from Dr. Deepa Pet Vet Clinic - Read heartwarming tales of recovery, rescue, and care for cats and dogs.">
    <meta name="keywords" content="pet success stories, veterinary success, pet recovery, animal rescue, pet care stories">
    <title>Success Stories - Dr. Deepa Pet Vet Clinic</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="js/components-loader.js"></script>
    <!-- Load config before other scripts -->
    <script src="js/config.js"></script>
    <style>
        /* Stories Page Specific Styles */
        .stories-page-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 1.5rem 0 1.5rem;
            text-align: center;
            margin-top: 70px;
        }
        
        .stories-page-header h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .stories-page-header p {
            font-size: 1.125rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .stories-filters {
            background: var(--light-color);
            padding: 1.5rem 0;
            position: sticky;
            top: 70px;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        
        .filter-toggle {
            display: none;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        
        .filter-container {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .filter-btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--primary-color);
            background: var(--white);
            color: var(--primary-color);
            border-radius: var(--radius-lg);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-normal);
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary-color);
            color: var(--white);
        }
        
        .search-box {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--light-gray);
            border-radius: var(--radius-lg);
            font-size: 1rem;
            width: 300px;
            max-width: 100%;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .share-story-btn-top {
            white-space: nowrap;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .share-story-btn-top i {
            font-size: 1.125rem;
        }
        
        .stories-main {
            padding: 2rem 0;
            background: var(--white);
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: var(--spacing-xl);
            flex-wrap: wrap;
            padding: 1rem 0;
        }
        
        #pageNumbers {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .page-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 0.75rem;
            border: 2px solid var(--primary-color);
            background: var(--white);
            color: var(--primary-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-normal);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }
        
        .page-btn:hover:not(:disabled),
        .page-btn.active {
            background: var(--primary-color);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(74, 144, 226, 0.3);
        }
        
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--light-gray);
            color: var(--gray);
        }
        
        .page-btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }
        
        .results-info {
            text-align: center;
            color: var(--gray);
            margin-bottom: var(--spacing-md);
            font-size: 1.125rem;
        }
        
        .results-info strong {
            color: var(--primary-color);
        }
        
        
        @media (max-width: 768px) {
            .stories-page-header {
                margin-top: 60px;
                padding: 1rem 0;
            }
            
            .stories-page-header h1 {
                font-size: 2rem;
            }
            
            .stories-filters {
                position: sticky;
                top: 60px;
                padding: 0.75rem 0;
            }
            
            .filter-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }
            
            .filter-container {
                flex-direction: column;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }
            
            .filter-container.active {
                max-height: 800px;
            }
            
            .search-box {
                width: 100%;
            }
            
            .stories-main {
                padding-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header loads automatically from includes/header.html -->

    <!-- Page Header -->
    <section class="stories-page-header">
        <div class="container">
            <h1><i class="fas fa-heart"></i> Success Stories</h1>
            <p>Every pet has a story, and we're honored to be part of their journey to health and happiness</p>
        </div>
    </section>

    <!-- Filters -->
    <section class="stories-filters">
        <div class="container">
            <button class="filter-toggle" id="filterToggle">
                <i class="fas fa-filter"></i> <span>Show Filters</span>
            </button>
            <div class="filter-container" id="filterContainer">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-th"></i> All Stories
                </button>
                <button class="filter-btn" data-filter="recovery">
                    <i class="fas fa-heartbeat"></i> Recovery
                </button>
                <button class="filter-btn" data-filter="rescue">
                    <i class="fas fa-hand-holding-heart"></i> Rescue
                </button>
                <button class="filter-btn" data-filter="emergency">
                    <i class="fas fa-ambulance"></i> Emergency
                </button>
                <button class="filter-btn" data-filter="long-term">
                    <i class="fas fa-calendar-check"></i> Long-term Care
                </button>
                <button class="filter-btn" data-filter="surgery">
                    <i class="fas fa-user-md"></i> Surgery
                </button>
                <input type="text" class="search-box" id="searchBox" placeholder="Search stories...">
                <a href="https://script.google.com/macros/s/AKfycbwB0ZWUlgLSwFQUg724V6cpRcEffCMIRyUynaMM5Io/dev" target="_blank" class="btn btn-primary share-story-btn-top">
                    <i class="fas fa-plus-circle"></i> Share Your Story
                </a>
            </div>
        </div>
    </section>

    <!-- Stories Grid -->
    <section class="stories-main">
        <div class="container">
            <div class="results-info" id="resultsInfo">
                Showing <strong id="showingCount">6</strong> of <strong id="totalCount">6</strong> stories
            </div>
            
            <div class="stories-grid" id="storiesGrid">
                <!-- Stories will be loaded dynamically from data/stories.json -->
                <!-- Make sure you're running a local server (see START_SERVER.md) -->
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <button class="page-btn" id="prevBtn" disabled>
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div id="pageNumbers"></div>
                <button class="page-btn" id="nextBtn">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- Share Story CTA -->
            <div class="share-story-cta" style="margin-top: 4rem;">
                <h3>Have a Success Story to Share?</h3>
                <p>We'd love to hear about your pet's journey with us!</p>
                <a href="https://script.google.com/macros/s/AKfycbwB0ZWUlgLSwFQUg724V6cpRcEffCMIRyUynaMM5Io/dev" target="_blank" class="btn btn-primary">Share Your Story</a>
            </div>
        </div>
    </section>

    <!-- Footer and Scroll to Top Button load automatically from includes/footer.html -->

    <script src="js/script.js"></script>
    <script src="js/load-stories.js"></script>
    <script src="js/stories-page.js"></script>
    <script src="js/open-story-form.js"></script>
    <script>
        // Mobile filter toggle
        const filterToggle = document.getElementById('filterToggle');
        const filterContainer = document.getElementById('filterContainer');
        
        if (filterToggle) {
            filterToggle.addEventListener('click', function() {
                filterContainer.classList.toggle('active');
                const isActive = filterContainer.classList.contains('active');
                const toggleText = this.querySelector('span');
                const toggleIcon = this.querySelector('i');
                
                if (isActive) {
                    toggleText.textContent = 'Hide Filters';
                    toggleIcon.className = 'fas fa-times';
                } else {
                    toggleText.textContent = 'Show Filters';
                    toggleIcon.className = 'fas fa-filter';
                }
            });
        }
    </script>
</body>
</html>
